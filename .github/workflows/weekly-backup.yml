name: Otomatik Haftalık Yedekleme

on:
  schedule:
    # Her Pazar gecesi saat 21:00 UTC (Türkiye saati ile 00:00 Pazar gecesi / Pazartesi başı)
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      target_email:
        description: 'Yedeklerin gönderileceği özel e-posta (Boş bırakılırsa adminin kaydettiği e-posta kullanılır)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  backup:
    name: Haftalık Veri Yedeği Al ve Sakla
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Haftalık Excel ve JSON Yedeği Oluştur
        id: create_backup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_EMAIL: ${{ inputs.target_email }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node scripts/backup-weekly.js

      - name: Yedek Dosyalarını GitHub Actions'a Yükle (90 Gün Güvenli Saklama)
        uses: actions/upload-artifact@v4
        with:
          name: lgs-haftalik-yedekler
          path: backups/
          retention-days: 90
          overwrite: true

      - name: Yedekleri backups Dalına Kalıcı Olarak Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/lgs_yedek_arsiv
          cp -r backups/* /tmp/lgs_yedek_arsiv/ 2>/dev/null || true
          if git ls-remote --exit-code --heads origin backups; then
            git fetch origin backups
            git checkout -f backups --
          else
            git checkout --orphan backups
            git rm -rf .
          fi
          mkdir -p arsiv
          cp -r /tmp/lgs_yedek_arsiv/* arsiv/ 2>/dev/null || true
          cat << 'EOF' > README.md
# 📦 LGS Soru Takip - Otomatik Sistem Yedekleri
Bu dalda Supabase veritabanından her hafta alınan otomatik JSON ve Excel yedekleri güvenle arşivlenmektedir.
EOF
          git add arsiv README.md
          if git diff --staged --quiet; then
            echo "Yeni değişiklik yok, commit atlanıyor."
          else
            git commit -m "Otomatik haftalık yedek: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin backups
          fi

      - name: E-Posta Gönderimi (SMTP Yapılandırılmışsa)
        if: steps.create_backup.outputs.can_send_mail == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ steps.create_backup.outputs.smtp_port }}
          secure: ${{ steps.create_backup.outputs.smtp_port == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[LGS Soru Takip] Haftalık Otomatik Veri Yedeği Raporu'
          to: ${{ steps.create_backup.outputs.backup_email }}
          from: ${{ steps.create_backup.outputs.smtp_from }}
          body: file://backups/summary.md
          attachments: ${{ steps.create_backup.outputs.excel_file }},${{ steps.create_backup.outputs.json_file }}
          convert_markdown: true
