<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soru Takip - LGS Çalışma ve Rehberlik Platformu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cream min-h-screen text-ink antialiased selection:bg-brandGreen/20">
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; padding: 24px; text-align: center; color: #dc2626;">
        Bu uygulamayı kullanabilmek için lütfen tarayıcınızda JavaScript'i etkinleştirin.
      </div>
    </noscript>
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root && !root.innerHTML.trim()) {
            root.innerHTML = '<div style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; padding: 40px 20px; max-width: 560px; margin: 60px auto; background: #ffffff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; color: #1e293b;"><div style="font-size: 48px; margin-bottom: 12px;">⚠️</div><h2 style="font-size: 22px; font-weight: 800; color: #b91c1c; margin-bottom: 12px;">Doğrudan Dosya Olarak Açılamaz</h2><p style="font-size: 14px; line-height: 1.6; color: #475569; margin-bottom: 24px;">Bu uygulama modern bir web uygulamasıdır (Vite/React). Yerel dosya (file://) yerine yerel geliştirici sunucusunu (<code>npm run dev</code>) veya yayındaki adresi kullanmalısınız.</p><div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"><a href="https://moses3545.github.io/lgs/" style="display: inline-block; padding: 12px 24px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 14px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px rgba(37,99,235,0.3);">Siteyi Aç (Moses)</a><a href="https://feritcemtkv.github.io/lgs/" style="display: inline-block; padding: 12px 24px; background: #475569; color: #ffffff; text-decoration: none; border-radius: 14px; font-weight: 700; font-size: 14px;">Yedek Adres</a></div></div>';
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
